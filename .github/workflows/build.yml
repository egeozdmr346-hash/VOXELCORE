name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: MSVC environment (cl.exe, cmake generator)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: C++ engine tests and benchmark (MSVC, no JNI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          cmake -S native -B native-test -DVOXELCORE_BUILD_JNI=OFF -DVOXELCORE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build native-test --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir native-test -C Release --output-on-failure 2>&1 | Tee-Object reports/cpp-tests.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem native-test -Recurse -Filter engine_bench.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Tee-Object reports/cpp-benchmark.txt

      - name: Build (Loom, MC 1.20.1 Yarn), native DLL (strict), Java tests, Java/native benchmark
        shell: cmd
        run: gradlew.bat build runBenchmark -PbuildNative=true --stacktrace

      - name: Verify jar contents and DLL JNI exports
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jar = "build/libs/voxelcore-0.2.0.jar"
          if (-not (Test-Path $jar)) { throw "missing $jar" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $jar))
          $names = @($z.Entries | ForEach-Object { $_.FullName })
          $mod = $z.GetEntry("fabric.mod.json")
          $json = (New-Object IO.StreamReader($mod.Open())).ReadToEnd()
          $z.Dispose()
          $need = @("fabric.mod.json","voxelcore.mixins.json","natives/voxelcore_native_windows_x64.dll",
                    "com/voxelcore/VoxelCore.class","com/voxelcore/VoxelCoreClient.class",
                    "com/voxelcore/ui/VoxelCoreScreen.class","com/voxelcore/ui/HudOverlay.class",
                    "com/voxelcore/native_bridge/NativeBridge.class")
          foreach ($n in $need) { if ($names -notcontains $n) { throw "jar missing $n" } }
          $foreign = @($names | Where-Object { $_ -like "natives/*" -and $_ -ne "natives/voxelcore_native_windows_x64.dll" -and $_ -ne "natives/" })
          if ($foreign.Count -gt 0) { throw "unexpected native file(s) in jar: $($foreign -join ', ')" }
          if ($json -notmatch '"version":\s*"0\.2\.0"') { throw "fabric.mod.json version is not 0.2.0" }
          $dll = Get-ChildItem build/native -Recurse -Filter voxelcore_native_windows_x64.dll | Select-Object -First 1
          if ($null -eq $dll) { throw "DLL not found under build/native" }
          $exports = (& dumpbin /exports $dll.FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed: $exports" }
          # every JNI symbol declared by the javac-generated header must be exported by the DLL
          $hdr = Get-Content build/generated/sources/headers/com_voxelcore_native_bridge_NativeBridge.h -Raw
          $syms = [regex]::Matches($hdr, 'Java_\w+') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if (@($syms).Count -lt 8) { throw "expected >= 8 JNI symbols in header, found $(@($syms).Count)" }
          foreach ($sym in $syms) {
            if (-not $exports.Contains($sym)) { throw "DLL does not export $sym" }
          }
          Write-Host "jar + DLL exports OK"

      - name: Package outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/libs/voxelcore-0.2.0.jar out/
          Copy-Item build/benchmark-results.txt out/java-benchmark.txt
          Copy-Item reports/cpp-tests.txt, reports/cpp-benchmark.txt out/
          Get-ChildItem build/native -Recurse -Filter voxelcore_native_windows_x64.dll | Select-Object -First 1 | Copy-Item -Destination out/
          git archive --format=zip --prefix=VoxelCore/ -o out/voxelcore-0.2.0-source.zip HEAD
          New-Item -ItemType Directory -Force out/wrapper/gradle/wrapper | Out-Null
          Copy-Item gradlew, gradlew.bat out/wrapper/
          Copy-Item gradle/wrapper/* out/wrapper/gradle/wrapper/

      - uses: actions/upload-artifact@v4
        with:
          name: voxelcore-0.2.0
          path: out/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/**
            build/test-results/**
            reports/**
            build/benchmark-results.txt
